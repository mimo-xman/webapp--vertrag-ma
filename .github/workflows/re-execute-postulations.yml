name: Re-execute Postulations

# Manual-trigger-only workflow: relaunches all postulations with status
# re_execute. Launched from the admin panel (via GitHub API - « Lancer la
# relance » → Workflow GitHub) or from the Actions tab. One parallel
# Execution per available mail sender; failures disable the sender with the
# error saved (visible in Admin → Services email).

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "Début de l'intervalle de relance (YYYY-MM-DD, optionnel)"
        required: false
      date_to:
        description: "Fin de l'intervalle de relance (YYYY-MM-DD, optionnel)"
        required: false

jobs:
  re-execute:
    name: Relaunch failed postulations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: workflow
        run: npm install

      # Same as send-postulations.yml: scripts import shared code from ../src/*
      # whose bare imports must resolve against a root-level node_modules.
      - name: Link node_modules for shared src/ imports
        run: ln -sfn "$GITHUB_WORKSPACE/workflow/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Run re-execution wave
        working-directory: workflow
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          DATE_FROM: ${{ github.event.inputs.date_from }}
          DATE_TO: ${{ github.event.inputs.date_to }}
        run: npx tsx re-execute-postulations.ts || test $? -eq 1

  re-trigger:
    name: Check and re-run
    needs: re-execute
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: workflow
        run: npm install

      - name: Link node_modules for shared src/ imports
        run: ln -sfn "$GITHUB_WORKSPACE/workflow/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Check for remaining postulations
        id: check
        working-directory: workflow
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          DATE_FROM: ${{ github.event.inputs.date_from }}
          DATE_TO: ${{ github.event.inputs.date_to }}
        # exit 0 = more to process (re-run) · exit 1 = drained (stop) ·
        # exit 2+ = fatal error → fail the job (never masked as "drained").
        run: |
          set +e
          npx tsx check-postulations.ts re_execute
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "has_more=true" >> $GITHUB_OUTPUT
          elif [ "$code" -eq 1 ]; then
            echo "has_more=false" >> $GITHUB_OUTPUT
          else
            echo "check-postulations.ts failed with exit code $code" >&2
            exit "$code"
          fi

      - name: Re-run workflow
        if: steps.check.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "More re_execute postulations remaining, re-triggering in 30s..."
          sleep 30
          # Forward the interval (if any) so the re-run targets the SAME window.
          ARGS=""
          if [ -n "${{ github.event.inputs.date_from }}" ]; then ARGS="$ARGS -f date_from=${{ github.event.inputs.date_from }}"; fi
          if [ -n "${{ github.event.inputs.date_to }}" ]; then ARGS="$ARGS -f date_to=${{ github.event.inputs.date_to }}"; fi
          gh workflow run re-execute-postulations.yml -R ${{ github.repository }} $ARGS
