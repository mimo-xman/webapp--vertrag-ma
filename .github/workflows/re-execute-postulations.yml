name: Re-execute Postulations

# Manual-trigger-only workflow: relaunches all postulations with status
# re_execute. Launched from the admin panel (via GitHub API) after the team
# has analyzed and fixed the failures.

on:
  workflow_dispatch:

jobs:
  re-execute:
    name: Relaunch failed postulations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: workflow
        run: npm install

      - name: Run re-execution
        working-directory: workflow
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
        run: npx tsx re-execute-postulations.ts || test $? -eq 1

  re-trigger:
    name: Check and re-run
    needs: re-execute
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: workflow
        run: npm install

      - name: Check for remaining postulations
        id: check
        working-directory: workflow
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
        run: |
          node -e "
          const mongoose = require('mongoose');
          (async () => {
            await mongoose.connect(process.env.MONGO_URI, { dbName: process.env.MONGO_DB_NAME || 'vertrag_ma' });
            const count = await mongoose.connection.collection('postulations').countDocuments({ status: 're_execute' });
            await mongoose.disconnect();
            process.exit(count > 0 ? 0 : 1);
          })().catch(() => process.exit(1));
          " && echo "has_more=true" >> $GITHUB_OUTPUT || echo "has_more=false" >> $GITHUB_OUTPUT

      - name: Re-run workflow
        if: steps.check.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "More re_execute postulations remaining, re-triggering in 30s..."
          sleep 30
          gh workflow run re-execute-postulations.yml -R ${{ github.repository }}
