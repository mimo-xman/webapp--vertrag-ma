name: Send Postulations

# Daily sending of due postulations (status en_attente/re_execute, scheduled
# today or overdue). One wave per run: every available mail sender gets its
# own parallel Execution. Postulations are claimed atomically (status →
# "executing") so nothing is ever sent twice. The self re-trigger pattern
# drains the queue (sidesteps the 6-hour GitHub Actions job limit).

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "Début de l'intervalle d'exécution (YYYY-MM-DD, optionnel, max aujourd'hui)"
        required: false
      date_to:
        description: "Fin de l'intervalle d'exécution (YYYY-MM-DD, optionnel, max aujourd'hui)"
        required: false
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily

jobs:
  send:
    name: Send wave
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: workflow
        run: npm install

      # The workflow scripts import shared models/libs from ../src/* - Node
      # resolves their bare imports (mongoose, nodemailer) by walking UP from
      # src/, so a node_modules must exist at the repo root. A symlink to
      # workflow/node_modules keeps ONE shared mongoose instance (models and
      # db.ts must never end up on two different mongoose copies).
      - name: Link node_modules for shared src/ imports
        run: ln -sfn "$GITHUB_WORKSPACE/workflow/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Run sender wave
        working-directory: workflow
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          DATE_FROM: ${{ github.event.inputs.date_from }}
          DATE_TO: ${{ github.event.inputs.date_to }}
        run: npx tsx send-postulations.ts || test $? -eq 1
        # exit 1 = queue drained (expected), exit 0 = more to process

  re-trigger:
    name: Check and re-run
    needs: send
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: workflow
        run: npm install

      - name: Link node_modules for shared src/ imports
        run: ln -sfn "$GITHUB_WORKSPACE/workflow/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Check for remaining postulations
        id: check
        working-directory: workflow
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          DATE_FROM: ${{ github.event.inputs.date_from }}
          DATE_TO: ${{ github.event.inputs.date_to }}
        # exit 0 = more to process (re-run) · exit 1 = drained (stop) ·
        # exit 2+ = fatal error → fail the job (never masked as "drained").
        run: |
          set +e
          npx tsx check-postulations.ts
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "has_more=true" >> $GITHUB_OUTPUT
          elif [ "$code" -eq 1 ]; then
            echo "has_more=false" >> $GITHUB_OUTPUT
          else
            echo "check-postulations.ts failed with exit code $code" >&2
            exit "$code"
          fi

      - name: Re-run workflow
        if: steps.check.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "More postulations pending, re-triggering in 30s..."
          sleep 30
          # Forward the interval (if any) so the re-run targets the SAME window.
          ARGS=""
          if [ -n "${{ github.event.inputs.date_from }}" ]; then ARGS="$ARGS -f date_from=${{ github.event.inputs.date_from }}"; fi
          if [ -n "${{ github.event.inputs.date_to }}" ]; then ARGS="$ARGS -f date_to=${{ github.event.inputs.date_to }}"; fi
          gh workflow run send-postulations.yml -R ${{ github.repository }} $ARGS
